name: Release

# Publishing happens from CI only. Push a v* tag and this workflow publishes to npm
# through Trusted Publishing (OIDC) - there is no npm token anywhere in this repo or
# in GitHub secrets. Configure the matching Trusted Publisher on npmjs.com first:
#
#   Publisher            GitHub Actions
#   Organization / user  aichixiaojuzi
#   Repository           dsh-model-quick-switch
#   Workflow filename    publish.yml
#   Environment          (leave empty)
#
# A mismatch in any of those four values makes npm reject the publish with E404.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Trusted Publishing needs npm >= 11.5.1; Node 24 bundles a compatible npm.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # There are no dependencies to cache, and a poisoned cache could expose the
          # OIDC token to code we do not control.
          package-manager-cache: false

      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Tool versions
        run: |
          node --version
          npm --version

      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js
          node --check dev/smoke.mjs

      - name: Smoke test
        run: node dev/smoke.mjs

      # Trusted publishing needs a token from this workflow's OIDC identity. These
      # facts are emitted as annotations on purpose: annotations are readable by
      # anyone (the raw job log is not), so a failed release can be diagnosed
      # without asking the repo owner to copy the log out by hand.
      - name: Publish environment
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          note() { echo "::notice title=$1::$2"; }
          note "node" "$(node --version)"
          note "npm" "$(npm --version)"
          note "ref" "${GITHUB_REF} (${GITHUB_REF_TYPE})"
          note "registry" "$(npm config get registry)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            note "OIDC" "ACTIONS_ID_TOKEN_REQUEST_URL is present"
          else
            echo "::error title=OIDC::ACTIONS_ID_TOKEN_REQUEST_URL is missing, so 'permissions: id-token: write' did not take effect"
          fi
          cfg="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          note "npmrc" "config file: ${cfg}"
          if [ -f "$cfg" ]; then
            note "npmrc authToken lines" "$(grep -c '_authToken' "$cfg" || true) (content is never printed)"
          else
            note "npmrc" "file does not exist"
          fi

      # Show the identity npm will validate: a wrong repository, workflow filename or
      # ref is rejected as a bare E404, which tells us nothing. The claims are public
      # metadata about this run, never a credential.
      - name: Inspect the OIDC identity
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          json=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          tok=$(printf '%s' "$json" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          if [ -z "$tok" ]; then
            echo "::error title=OIDC::the token endpoint returned no value"
            exit 0
          fi
          printf '%s' "$tok" | node -e '
            let s = ""
            process.stdin.on("data", d => { s += d }).on("end", () => {
              const claims = JSON.parse(Buffer.from(s.trim().split(".")[1], "base64url").toString())
              for (const k of ["sub", "repository", "repository_owner", "job_workflow_ref", "ref", "event_name", "environment"]) {
                console.log(`::notice title=claim ${k}::${claims[k] ?? "(absent)"}`)
              }
            })'

      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` for registry-url. With no
      # token configured that placeholder can make npm authenticate with an empty
      # credential instead of doing the OIDC exchange, which the registry answers with
      # the same E404 as a publisher mismatch. Drop the line, keep the registry.
      - name: Remove the token placeholder so npm publishes through OIDC
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          cfg="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$cfg" ] && grep -q '_authToken' "$cfg"; then
            grep -v '_authToken' "$cfg" > "$cfg.tmp"
            mv "$cfg.tmp" "$cfg"
            echo "::notice title=npmrc::removed the _authToken placeholder line"
          else
            echo "::notice title=npmrc::no _authToken line to remove"
          fi
          echo "::notice title=registry now::$(npm config get registry)"

      - name: Publish to npm
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set +e
          npm publish 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Re-emit the reason as annotations so it survives without the raw log.
            grep -iE 'npm (error|ERR!|warn)' publish.log | head -n 12 | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=npm publish failed::${line}"
            done
            exit "$code"
          fi

      # Manual dispatch from a branch: list what would be packed, without contacting
      # the registry. "npm publish --dry-run" is deliberately NOT used: it still runs
      # the registry-side publish preflight, so on a branch whose version is already
      # published it fails with "cannot publish over the previously published
      # versions" - a red run that says nothing about the health of the pipeline.
      - name: Pack check (branch dispatch does not publish)
        if: github.ref_type != 'tag'
        run: npm pack --dry-run
