name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=22"; 22 is the floor, 24 the current line.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js
          node --check dev/smoke.mjs

      - name: Smoke test (render + behaviour assertions)
        run: node dev/smoke.mjs

      - name: Validate package manifest
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch is required for the plugin catalog'); if(!p.dsh?.client) throw new Error('dsh.client is required'); console.log('manifest ok:', p.name, p.version)"
